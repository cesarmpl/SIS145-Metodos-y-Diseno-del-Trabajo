version: '1.0'

networks:
    laravel_network1:
        driver: bridge

volumes:
    db_server11_data:
        driver: local

services:
    db_server11:
        image: postgres:13
        container_name: db_server11
        restart: unless-stopped  
        environment:
            POSTGRES_USER: root
            POSTGRES_PASSWORD: root
            POSTGRES_DB: productos_db
        ports:
            - "5450:5432"
        volumes:
            - db_server11_data:/var/lib/postgresql/data
        networks:
            - laravel_network1
